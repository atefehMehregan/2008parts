<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-label="2008parts">
  <title>2008parts</title>
  <!-- ============================================================
       هشدار آگاهانه: این فایل «وردمارک برداری نهایی» نیست.

       متن زیر یک <text> زنده است و به فونت سیستمِ دستگاهِ بیننده
       وابسته است، پس روی دو دستگاه ممکن است متفاوت دیده شود.
       این عمدی است: پروژه به‌صورت طراحی‌شده هیچ فونت وبی بار نمی‌کند.

       برای تبدیل به مسیر (outline) — که شکل نهایی یک وردمارک است —
       باید یک فونت لاتینِ دارای مجوز انتخاب شود.

       نشانِ برداریِ سمت راست به فونت وابسته نیست و شکل قطعیِ برند است.

       نام برند یک شکل دارد و فقط همین: 2008parts. پیش از این دو خط بود
       (نام فارسی بزرگ + نام لاتین کوچک) و همان ساختار دو ادعای برندی
       می‌ساخت. اکنون یک خط است، هم‌راستا با res.locals.storeName.
       direction="rtl" برداشته شد چون متن لاتین است و با آن جابه‌جا
       می‌شد؛ خط پایه از ۳۱/۴۹ به ۴۱ آمد تا تک‌خط روی مرکز نشان
       (y=32) بنشیند. هندسه، viewBox و ابعاد دست‌نخورده‌اند.
       ============================================================ -->
